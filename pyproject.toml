[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cctx"
version = "0.0.1"
description = "Diagnose Claude Code sessions — find what went wrong, what it cost, and what to add to CLAUDE.md"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jacquard Labs" }]

dependencies = [
    "click>=8.0",
    "rich-click>=1.8",
    "rich>=13.0",
    "anthropic>=0.25",
    "textual>=0.59",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pytest-asyncio>=0.23",
    "anyio[trio]",
]

[project.scripts]
cctx = "cctx.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["cctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]
# scrub.py has regex declarations with inline comments that read better as
# single lines than wrapped (E501), and intentionally-unused loop variables
# kept for symmetry across passes (B007).
"tests/fixtures/scrub.py" = ["E501", "B007"]
# Diagnostician test helpers build multi-arg make_* calls that read better
# as single lines than split across lines.
"tests/diagnostician/*.py" = ["E501"]
"tests/exporters/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
